name: Job Alert Agent

on:
  # The schedule is off in this public copy, so it doesn't run without secrets.
  # After you fork and add your repository secrets (see README), uncomment it.
  # schedule:
  #   # 8:00 AM IST = 2:30 AM UTC
  #   - cron: "30 2 * * *"
  #   # 6:00 PM IST = 12:30 PM UTC
  #   - cron: "30 12 * * *"
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      # No database cache any more: state lives in Neon, shared with the board.
      # The old actions/cache approach lost dedupe history whenever the cache
      # was evicted, which silently re-alerted every job in the digest.
      - name: Run job alert agent
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
          LLM_MODEL: claude-haiku-4-5
          ENABLE_IIMJOBS: "true"
          ENABLE_MYCAREERSFUTURE: "true"
          # LinkedIn stays off here: the runner has no exported cookies, and
          # there is no login automation on purpose. See AGENTS.md.
          ENABLE_LINKEDIN: "false"
          # Retired — Google CAPTCHAs datacenter IPs and offers no geo control.
          # See SOURCES.md for what replaced it.
          ENABLE_GOOGLE_JOBS: "false"
          MAX_JOBS_PER_QUERY: "30"
          DAYS_SINCE_POSTED: "14"
          TARGET_ROLES: ${{ secrets.TARGET_ROLES }}
          TARGET_LOCATIONS: ${{ secrets.TARGET_LOCATIONS }}
          TARGET_GEOS: "AE,SG,GB,IE,TH,MY,VN"
          RELEVANCE_SCORE_THRESHOLD: "7.0"
          MAX_JOBS_IN_EMAIL: "10"
        run: python main.py

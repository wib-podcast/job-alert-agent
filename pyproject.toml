[tool.ruff]
target-version = "py311"
exclude = [".venv", "data", ".github"]

[tool.ruff.lint]
# Deliberately narrow: a correctness gate, not a style gate.
# E9 = syntax/IO errors, F63/F7 = broken comparisons and statements,
# F82 = undefined names, F401 = unused imports.
select = ["E9", "F63", "F7", "F82", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The modules under test live at the repo root, not in an installed package.
# Without this, pytest puts only tests/ on sys.path and every import fails.
pythonpath = ["."]
